      responses:
        "200":
          description: "OK"
          content:
            text/html:
              schema:
                type: "string"
              examples:
                Example#1:
                  value: "\n                    <html>\n                        <body>\n\
                    \                            <p>Update in <span id=\"timer\">60</span>\
                    \ seconds...</p>\n                            <script>\n     \
                    \                           var timeLeft = 60;\n             \
                    \                   var timerElement = document.getElementById('timer');\n\
                    \                                \n                          \
                    \      // هر ثانیه تایمر رو آپدیت می‌کنه\n                   \
                    \             var countdown = setInterval(function() {\n     \
                    \                               if (timeLeft <= 0) {\n       \
                    \                                 clearInterval(countdown);\n\
                    \                                    } else {\n              \
                    \                          timeLeft--;\n                     \
                    \                   timerElement.innerHTML = timeLeft;\n     \
                    \                               }\n                          \
                    \      }, 1000); // هر 1000 میلی‌ثانیه (1 ثانیه) اجرا میشه\n \
                    \                           </script>\n                      \
                    \  </body>\n                    </html>\n                "
