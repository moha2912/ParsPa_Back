  /admin/updateArticle:
    get:
      description: ""
      responses:
        "200":
          description: "OK"
          content:
            text/html:
              schema:
                type: "string"
              examples:
                Example#1:
                  value: "\n                        <html>\n                     \
                    \       <body>\n                                <p>Executing command...</p>\n\
                    \                                <pre id=\"output\"></pre>\n \
                    \                               <script>\n                   \
                    \                 var eventSource = new EventSource(\"/streamUpdate\"\
                    );\n                                    var outputElement = document.getElementById('output');\n\
                    \                                    \n                      \
                    \              eventSource.onmessage = function(event) {\n   \
                    \                                     outputElement.innerHTML\
                    \ += event.data + \"\\\\n\";\n                               \
                    \     };\n\n                                    eventSource.onerror\
                    \ = function() {\n                                        outputElement.innerHTML\
                    \ += \"\\\\n[Process finished]\";\n                          \
                    \              eventSource.close();\n                        \
                    \            };\n                                </script>\n \
                    \                           </body>\n                        </html>\n\
                    \                    "
  /admin/updateLanding:
    get:
